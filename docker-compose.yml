services:
  taskforge:
    build: .
    env_file:
      - .env
    environment:
      STATE_FILE: ${TASKFORGE_STATE_FILE:-/data/taskforge-state.sqlite3}
    ports:
      - "8080:8080"
    volumes:
      - ${TARGET_REPO:-./example-repo}:${TARGET_REPO:-/workspace/repo}
      - ${WORKTREE_ROOT:-./worktrees}:${WORKTREE_ROOT:-/workspace/worktrees}
      - ${CODEX_HOME:-/root/.codex}:/root/.codex
      - ${SSH_HOME:-/root/.ssh}:/root/.ssh:ro
      - ./data:/data
    restart: unless-stopped
